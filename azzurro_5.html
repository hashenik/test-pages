<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#19191B">
  <meta name="description" content="Azzurro w Toruniu: poznaj menu, znajdź najbliższą restaurację, sprawdź warsztaty kulinarne, salę bankietową i catering.">
  <meta property="og:title" content="Azzurro Restauracje | Dobry smak. Dobry czas.">
  <meta property="og:description" content="Trzy restauracje w Toruniu. Pizza, pasta i dobre chwile przy wspólnym stole.">
  <meta property="og:type" content="website">
  <title>Azzurro Restauracje | Dobry smak. Dobry czas.</title>
  <!-- Favicon: neutralna typograficzna zastępcza ikona DEMO. Podmienić na oryginalny sygnet marki. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2319191B'/%3E%3Ctext x='32' y='47' text-anchor='middle' fill='%23FFFFFF' font-size='48' font-family='Georgia'%3Ea%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400,0,0;9..144,500,0,0;9..144,600,0,0;9..144,700,0,0&display=swap" rel="stylesheet">
  <style>
    /* AZZURRO ITALIAN EXPERIENCE v1.1 · paleta nawiązująca do istniejącej strony i fotografii lokali | HTML/CSS/JS
       UWAGA: paleta: antracyt, biel, czerwień i żółć z wizualnych materiałów Azzurro. HEX są przybliżone, NIE potwierdzone z oryginalnych plików CSS.
       Logo w nagłówku jest zastępczym napisem typograficznym, nie rekonstrukcją oryginalnego znaku.
       Oryginalne zdjęcia: azzurro-restauracja.pl. Zdjęcia posiłków z Unsplash są DEMO i nie przedstawiają potwierdzonych pozycji Azzurro. */
    :root {
      --brand-primary:#19191B; --brand-secondary:#B52B29; --brand-accent:#E5B62E; --brand-blue:#37658A;
      --surface-main:#F8F8F6; --surface-soft:#F0F0ED; --surface-dark:#131315;
      --text-primary:#222326; --text-secondary:#606167; --border-subtle:#D8D8D5;
      --paper:#FFFFFF; --white:#fff; --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',Arial,sans-serif;
      --container:1250px; --header:78px; --ease:cubic-bezier(.2,.7,.22,1);
    }
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:100px}
    body{margin:0;background:var(--surface-main);font-family:var(--sans);color:var(--text-primary);-webkit-font-smoothing:antialiased}
    body.lock-scroll{overflow:hidden}
    ::selection{background:var(--brand-accent);color:#131315}
    img{display:block;max-width:100%;height:auto}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    :focus-visible{outline:3px solid #B52B29;outline-offset:4px}
    .skip{position:fixed;top:-80px;left:12px;z-index:500;background:#fff;color:#111;padding:12px 18px}
    .skip:focus{top:10px}
    .wrap{width:min(var(--container),calc(100% - 64px));margin-inline:auto}
    .eyebrow{font-size:.72rem;letter-spacing:.22em;font-weight:800;text-transform:uppercase;line-height:1.5}
    .eyebrow::before{content:'';width:22px;height:1px;display:inline-block;background:currentColor;vertical-align:middle;margin-right:10px;opacity:.7}
    .overline{display:flex;gap:16px;align-items:center;color:var(--brand-secondary);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}
    .serif,h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:-.045em}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:clamp(3.4rem,7.1vw,7.5rem);line-height:1.04}
    h2{font-size:clamp(2.65rem,5.3vw,5.5rem);line-height:1.07}
    h3{font-size:clamp(1.6rem,2.5vw,2.6rem);line-height:1.17}
    p{line-height:1.8}
    .lead{font-size:clamp(1rem,1.6vw,1.23rem);line-height:1.8;color:var(--text-secondary);max-width:590px}
    .tiny{font-size:.76rem;letter-spacing:.04em}
    .muted{color:var(--text-secondary)}
    .rule{border-top:1px solid var(--border-subtle)}
    .section{padding:clamp(80px,10vw,145px) 0}
    .section.tight{padding:clamp(58px,7vw,100px) 0}
    .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:48px}
    .section-head h2{margin:14px 0 0;max-width:790px}
    .section-head .lead{margin:0;max-width:360px}
    .capsule{border:1px solid currentColor;border-radius:100px;padding:9px 15px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:inline-block}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:16px;min-height:53px;padding:14px 25px;border:1px solid transparent;background:var(--brand-primary);color:#fff;font-weight:800;font-size:.84rem;letter-spacing:.01em;transition:transform .25s var(--ease),background .25s,border-color .25s;white-space:nowrap}
    .btn:hover{transform:translateY(-2px);background:#333438}
    .btn.light{background:#FFFFFF;color:var(--brand-primary)}
    .btn.light:hover{background:#F0F0ED}
    .btn.outline{background:transparent;color:inherit;border-color:currentColor}
    .btn.outline:hover{background:rgba(20,20,20,.06)}
    .btn.small{min-height:44px;padding:10px 17px;font-size:.78rem}
    .link-arrow{display:inline-flex;align-items:center;gap:19px;border-bottom:1px solid currentColor;padding-bottom:9px;font-weight:800;font-size:.82rem;transition:gap .2s}
    .link-arrow:hover{gap:27px}
    .arrow{font-size:1.2em;line-height:1}
    .demo-tag{position:absolute;z-index:2;right:12px;bottom:12px;background:rgba(255,253,247,.95);color:#262626;padding:7px 10px;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .photo{display:block;position:relative;overflow:hidden;margin:0;background:linear-gradient(125deg,#34363A,#7C7E83);isolation:isolate}
    .photo img{height:100%;width:100%;object-fit:cover;transition:transform .9s var(--ease)}
    .photo:hover img{transform:scale(1.035)}
    .photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.15));pointer-events:none}
    .photo figcaption{position:absolute;bottom:18px;left:20px;z-index:2;color:#fff;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;text-shadow:0 1px 8px #0009}
    .topbar{background:#141416;color:#F1F1EE;padding:7px 20px;text-align:center;text-transform:uppercase;letter-spacing:.15em;font-size:.61rem;font-weight:800}
    .site-header{position:sticky;top:0;z-index:100;background:rgba(248,248,246,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(30,30,32,.13)}
    .nav-inner{height:var(--header);display:flex;align-items:center;gap:24px}
    .brand{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;line-height:1;color:#1B1C1F}
    .brand strong{font-family:var(--sans);font-size:2.23rem;letter-spacing:-.095em;font-weight:800;line-height:.92}
    .brand small{font-weight:800;letter-spacing:.29em;font-size:.52rem;padding-left:4px;margin-top:6px}
    .nav-links{margin-left:auto;display:flex;align-items:center;gap:clamp(14px,1.8vw,28px)}
    .nav-links a{font-size:.76rem;font-weight:800;position:relative;white-space:nowrap;transition:color .2s}
    .nav-links a.active,.nav-links a:hover{color:#AD2B29}
    .nav-links a::after{content:'';position:absolute;left:0;right:100%;bottom:-8px;background:#AD2B29;height:2px;transition:right .25s}
    .nav-links a.active::after,.nav-links a:hover::after{right:0}
    .nav-cta{margin-left:12px}
    .nav-toggle{display:none;width:44px;height:44px;border:1px solid var(--border-subtle);background:transparent;align-items:center;justify-content:center;flex-direction:column;gap:5px}
    .nav-toggle span{height:2px;width:19px;background:var(--text-primary);transition:transform .2s}
    .menu-open .nav-toggle span:first-child{transform:translateY(3.5px) rotate(45deg)}
    .menu-open .nav-toggle span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
    .hero{background:var(--surface-dark);color:#FFFFFF;min-height:660px;position:relative;overflow:hidden}
    .hero-grid{display:grid;grid-template-columns:.95fr 1.05fr;min-height:670px;align-items:stretch}
    .hero-copy{position:relative;z-index:3;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:88px clamp(35px,5vw,85px) 100px max(30px,calc((100vw - var(--container))/2));}
    .hero-copy .eyebrow{color:#F5CD56}
    .hero h1{margin:30px 0 26px;max-width:810px}
    .hero h1 em{font-weight:400;color:#F3D36E}
    .hero .lead{color:#E6E6E4;max-width:450px}
    .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
    .hero-side{height:100%;position:relative;min-height:510px}
    .hero-side .photo{width:100%;height:100%;background:radial-gradient(circle at 53% 46%,#D5A93D 0 19%,#B52B29 19.5% 23%,#E3B94C 23.5% 26%,transparent 26.5%),radial-gradient(ellipse at 60% 50%,#515357,#202124 68%)}
    .hero-side img{object-position:50% 50%}
    .hero-side::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#131315 0%,transparent 19%)}
    .hero-side .hero-stamp{position:absolute;left:10%;bottom:10%;width:128px;height:128px;border:1px solid #fff9;border-radius:50%;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;font-weight:800;font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;transform:rotate(-13deg);background:#14282677;backdrop-filter:blur(5px)}
    .marquee{background:#E6B92B;color:#171719;padding:18px 0;overflow:hidden;white-space:nowrap;text-align:center;letter-spacing:.15em;font-size:.74rem;font-weight:800;text-transform:uppercase}
    .marquee span{display:inline-block;margin:0 16px}
    .marquee b{font-size:1.2rem;margin:0 18px;vertical-align:middle}
    .menu-home{background:var(--surface-main)}
    .menu-widget{padding:32px;background:var(--paper);border:1px solid var(--border-subtle)}
    .tabs-row{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:23px}
    .pill{background:transparent;color:var(--text-primary);border:1px solid #D6D6D2;border-radius:100px;padding:11px 18px;font-size:.78rem;font-weight:800;transition:all .2s;min-height:41px}
    .pill.active,.pill[aria-pressed=true],.pill:hover{background:var(--brand-primary);color:#fff;border-color:var(--brand-primary)}
    .pills-label{font-size:.69rem;color:#606167;text-transform:uppercase;font-weight:800;letter-spacing:.15em;margin:0 0 12px}
    .category-tabs{border-bottom:1px solid var(--border-subtle);padding-bottom:23px;margin-bottom:28px}
    .menu-bar{display:flex;align-items:center;justify-content:space-between;gap:25px;flex-wrap:wrap;margin:0 0 25px}
    .search-field{display:flex;align-items:center;gap:10px;min-width:min(100%,305px);background:var(--surface-main);border:1px solid var(--border-subtle);padding:2px 14px}
    .search-field input{background:transparent;min-height:43px;min-width:120px;border:0;outline:none;width:100%;font-size:.88rem}
    .search-field:focus-within{outline:2px solid #B52B29;outline-offset:2px}
    .menu-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 34px}
    .dish{border-top:1px solid #DDDDDA;padding:23px 0 22px;display:flex;align-items:flex-start;gap:16px;justify-content:space-between}
    .dish h4{font-family:var(--sans);font-weight:800;letter-spacing:0;font-size:.96rem;margin:0 0 7px}
    .dish p{font-size:.78rem;line-height:1.7;color:var(--text-secondary);margin:0;max-width:410px}
    .dish strong{font-size:.83rem;white-space:nowrap;font-weight:800;color:#AD2926}
    .dish .featured-name::before{content:'✳ ';color:#B52B29}
    .empty-state{grid-column:1/-1;text-align:center;padding:45px 18px;color:var(--text-secondary)}
    .menu-note{margin:21px 0 0;color:var(--text-secondary);font-size:.75rem;line-height:1.7}
    .menu-widget-footer{padding-top:25px;border-top:1px solid var(--border-subtle);margin-top:8px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .places-section{background:#EEEEEA}
    .places-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:25px}
    .place-card{position:relative;color:#fff;overflow:hidden;min-height:390px}
    .place-card.tall{grid-row:span 2;min-height:805px}
    .place-card .photo{position:absolute;inset:0}
    .place-card .photo::after{background:linear-gradient(180deg,transparent 25%,rgba(7,19,15,.75) 100%)}
    .place-details{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:33px 35px}
    .place-details .eyebrow{color:#F0C849}
    .place-details h3{font-size:clamp(2rem,4vw,3.9rem);margin:10px 0}
    .place-details p{font-size:.82rem;color:#F8F8F6;margin:0 0 20px}
    .place-details a{font-size:.8rem;font-weight:800;border-bottom:1px solid #fff7;padding-bottom:5px}
    .story-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:clamp(50px,8vw,130px);align-items:center}
    .story-photos{position:relative;padding:0 70px 65px 0}
    .story-photos .main-photo{height:520px}
    .story-photos .inset-photo{position:absolute;bottom:0;right:0;width:47%;height:235px;border:8px solid var(--surface-main)}
    .story-copy h2{margin:18px 0 24px}
    .story-copy p{max-width:460px;color:var(--text-secondary)}
    .story-signature{font-family:var(--serif);font-style:italic;font-size:2rem;color:#B52B29;margin-top:30px}
    .service-spotlight{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;background:#E9E9E5}
    .service-spotlight .photo{min-height:480px}
    .service-spotlight .spotlight-copy{padding:clamp(40px,6vw,95px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
    .service-spotlight h2{margin:18px 0}
    .service-spotlight .lead{margin-bottom:26px}
    .service-cards{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}
    .service-card{border:1px solid var(--border-subtle);padding:36px 35px;display:flex;flex-direction:column;gap:12px;min-height:285px}
    .service-card .count{color:#B52B29;letter-spacing:.2em;font-size:.72rem;font-weight:800}
    .service-card h3{margin:0}
    .service-card p{margin:0;flex:1;color:var(--text-secondary);font-size:.88rem}
    .gallery-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:170px;gap:12px}
    .gallery-tile{position:relative;display:block;width:100%;padding:0;border:0;background:#D4D5D4;overflow:hidden;text-align:left}
    .gallery-tile .photo{display:block;width:100%;height:100%}
    .gallery-tile img{height:100%;width:100%;object-fit:cover}
    .gallery-tile .tile-zoom{position:absolute;right:15px;top:15px;z-index:3;background:#FFFFFF;color:#202124;padding:8px 12px;font-size:.7rem;font-weight:800}
    .gallery-tile:nth-child(6n+1){grid-column:span 6;grid-row:span 2}
    .gallery-tile:nth-child(6n+2){grid-column:span 3;grid-row:span 2}
    .gallery-tile:nth-child(6n+3){grid-column:span 3;grid-row:span 1}
    .gallery-tile:nth-child(6n+4){grid-column:span 3;grid-row:span 1}
    .gallery-tile:nth-child(6n+5){grid-column:span 5;grid-row:span 2}
    .gallery-tile:nth-child(6n+6){grid-column:span 7;grid-row:span 2}
    .contact-band{background:#A52624;color:#FFFFFF;overflow:hidden}
    .contact-band .wrap{display:flex;gap:30px;align-items:center;justify-content:space-between;padding-block:72px}
    .contact-band h2{font-size:clamp(2.4rem,5vw,4.4rem);margin:0}
    .contact-band p{max-width:510px;margin:12px 0 0}
    .site-footer{background:#151517;color:#F3F3F1;padding:78px 0 27px}
    .footer-grid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:50px;margin-bottom:70px}
    .site-footer .brand{color:#FFFFFF;display:inline-flex;margin-bottom:24px}
    .site-footer p{color:#C7C8CB;font-size:.83rem}
    .footer-heading{font-size:.72rem;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:#F0C849;margin-bottom:22px}
    .site-footer a:not(.brand){display:block;color:#F4F4F1;font-size:.84rem;margin:0 0 14px;line-height:1.5}
    .site-footer a:hover{text-decoration:underline}
    .footer-bottom{border-top:1px solid #ffffff24;padding-top:25px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#B8B9BC;font-size:.74rem}
    .page-hero{background:#1C1C1F;color:#FFFFFF;min-height:360px;position:relative;overflow:hidden}
    .page-hero .wrap{position:relative;z-index:2;padding-top:85px;padding-bottom:80px}
    .page-hero h1{font-size:clamp(3.4rem,7vw,6.5rem);margin:17px 0 16px}
    .page-hero .lead{color:#E4E5E5}
    .page-hero::after{content:'A';position:absolute;right:6vw;top:-120px;font-family:var(--serif);font-size:590px;font-style:italic;opacity:.055;line-height:1;pointer-events:none}
    .location-hero{display:grid;grid-template-columns:.75fr 1.25fr;min-height:525px;background:#1B1B1D;color:#FFFFFF}
    .location-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:65px 55px 70px max(30px,calc((100vw - var(--container))/2))}
    .location-copy h1{font-size:clamp(3.5rem,5.5vw,6.3rem);margin:22px 0 20px}
    .location-copy .lead{color:#E6E6E5}
    .location-hero .photo{height:100%;min-height:525px}
    .quick-actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:30px}
    .location-details-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:start}
    .hours-table{width:100%;border-collapse:collapse;margin-top:22px}
    .hours-table td{padding:11px 0;font-size:.87rem;border-bottom:1px solid var(--border-subtle)}
    .hours-table td:last-child{text-align:right;font-weight:800}
    .address-card{background:#F0F0ED;padding:35px;margin-top:22px}
    .address-card strong{display:block;font-family:var(--serif);font-size:1.65rem;font-weight:500;margin-bottom:12px}
    .address-card a{display:inline-flex;gap:9px;margin-top:13px;font-size:.82rem;font-weight:800;text-decoration:underline}
    .info-card{background:#F1F1EF;padding:30px;border:1px solid #DDDDDA}
    .info-card h3{margin:0 0 10px}
    .info-card p{font-size:.9rem;color:var(--text-secondary)}
    .badge-demo{font-size:.67rem;letter-spacing:.12em;font-weight:800;text-transform:uppercase;background:#F5E8BF;padding:7px 10px;color:#554410}
    .split-visual{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}
    .split-visual .photo{height:470px}
    .inner-intro{max-width:800px;margin-bottom:52px}
    .inner-intro h2{margin:16px 0}
    .statline{display:flex;gap:12px;align-items:center;padding:21px 0;border-bottom:1px solid var(--border-subtle)}
    .statline b{color:#B52B29;font-family:var(--serif);font-size:2.1rem;font-weight:500;width:55px;flex:none}
    .statline span{font-size:.93rem}
    .gallery-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px}
    .contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .contact-place{padding:35px;background:#FFFFFF;border:1px solid var(--border-subtle)}
    .contact-place h3{margin:0 0 10px}
    .contact-place p{color:var(--text-secondary);font-size:.84rem;margin-bottom:8px}
    .contact-place .contact-links a{display:block;font-weight:800;text-decoration:underline;font-size:.83rem;margin-top:13px}
    .location-bottom-bar{display:none}
    .to-top{position:fixed;right:23px;bottom:24px;z-index:80;display:grid;place-items:center;width:46px;height:46px;background:#29292B;color:#fff;border:1px solid #fff5;box-shadow:0 8px 30px #10101322;opacity:0;pointer-events:none;transition:opacity .2s}
    .to-top.visible{opacity:1;pointer-events:auto}
    .lightbox[hidden]{display:none!important}
    .lightbox{position:fixed;inset:0;z-index:500;background:rgba(8,18,16,.95);display:flex;align-items:center;justify-content:center;padding:65px 70px 55px;color:#fff}
    .lightbox-content{width:min(1100px,100%);height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px}
    .lightbox-photo{position:relative;max-width:100%;max-height:calc(100% - 46px);min-height:0;display:flex;align-items:center;justify-content:center}
    .lightbox img{max-height:75vh;max-width:100%;width:auto;height:auto;object-fit:contain}
    .lightbox-close,.lightbox-next,.lightbox-prev{position:absolute;z-index:3;border:1px solid #fff5;background:#ffffff1f;color:#fff;width:46px;height:46px;font-size:1.8rem;display:grid;place-items:center}
    .lightbox-close{right:24px;top:18px}

  function renderMenuResults(){

    const view=preview ? ((menuCategory==='Wszystkie'&&!menuQuery.trim()) ? [r.menu[17],r.menu[20],r.menu[12],r.menu[15],r.menu[3],r.menu[35]] : filtered.slice(0,6)) : filtered;
    widget.querySelector('[data-menu-results]').innerHTML=view.length?view.map(d=>`<article class="dish"><div><h4>${esc(d.name)}</h4><p>${esc(d.description)}</p></div><strong>${price(d.price)}</strong></article>`).join(''):'<div class="empty-state"><h3>Nie znaleziono dań</h3><p>Wybierz inną kategorię lub zmień wyszukiwaną frazę.</p><button class="btn small" data-reset-menu type="button">Wyczyść filtry</button></div>';
    widget.querySelector('[data-menu-count]').textContent=`${filtered.length} ${filtered.length===1?'pozycja':filtered.length>=2&&filtered.length<=4?'pozycje':'pozycji'} w menu${preview?' · podgląd':''}`;
    const officialLink=widget.querySelector('[data-official-menu]');if(officialLink)officialLink.href=r.officialMenu;
    widget.querySelectorAll('[data-select-location]').forEach(b=>{const active=b.dataset.selectLocation===selectedLocation;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
    widget.querySelectorAll('[data-select-category]').forEach(b=>{const active=b.dataset.selectCategory===menuCategory;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
  }

  <section class="section tight"><div class="wrap info-card"><h3>Zapytaj o catering</h3><p>Oficjalny kontakt: <a href="tel:+48535122227" style="text-decoration:underline;font-weight:800">535 122 227</a> · <a href="mailto:kontakt@azzurro.catering" style="text-decoration:underline;font-weight:800">kontakt@azzurro.catering</a>. Siedziba: ul. Szosa Bydgoska 3, Toruń.</p><a class="btn small" href="https://azzurro.catering/kontakt/" target="_blank" rel="noopener noreferrer">Wyślij zapytanie na oficjalnej stronie ↗</a></div></section>`;}
  function galleryPage(){return `${pageHero('Galeria / chwile w Azzurro','U nas tak<br><em>smakuje czas.</em>','Zajrzyj do naszych lokali i zobacz atmosferę spotkań. Fotografie poglądowe dań oznaczono jako DEMO.')}<section class="section tight"><div class="wrap"><div class="gallery-toolbar"><div><span class="eyebrow">Fotografie</span><h2>Spójrz bliżej.</h2></div><div class="tabs-row" role="group" aria-label="Filtry galerii">${['Wszystkie','Jedzenie','Restauracje','Wydarzenia'].map(t=>`<button class="pill ${galleryType===t?'active':''}" data-gallery-filter="${t}" type="button" aria-pressed="${galleryType===t}">${t}</button>`).join('')}</div></div><div id="gallery-output">${galleryTiles(GALLERY.filter(x=>galleryType==='Wszystkie'||x.type===galleryType))}</div><p class="menu-note">Zdjęcia lokali, sali i warsztatów: oficjalna strona Azzurro. Fotografie jedzenia: Unsplash, materiały poglądowe DEMO, nie są zdjęciami potwierdzonych potraw Azzurro.</p></div></section>${contactBand()}`;}
  function contactPage(){return `${pageHero('Kontakt / trzy restauracje','Spotkajmy się<br><em>w Azzurro.</em>','Trzy lokalizacje w Toruniu, jeden powód, by wpaść na coś dobrego.')}<section class="section tight"><div class="wrap"><div class="section-head"><div><span class="eyebrow">Odwiedź nas</span><h2>Znajdź swoje miejsce.</h2></div></div><div class="contact-grid">${places().map(r=>`<article class="contact-place"><span class="eyebrow">Restauracja ${r.number}</span><h3>${esc(r.name)}</h3><p>${esc(r.address)}</p><p><strong>Godziny:</strong> pn.–czw. 11:00–21:00, pt. 11:00–21:30, sob. 12:00–21:30, niedz. 12:00–21:00</p><div class="contact-links"><a href="${phoneURL(r.phone)}">${esc(r.phone)} ↗</a>${r.extraPhone?`<a href="${phoneURL(r.extraPhone)}">${esc(r.extraPhone)} ↗</a>`:''}<a href="${mapURL(r)}" target="_blank" rel="noopener noreferrer">Otwórz mapę ↗</a><a href="#/lokale/${r.id}">Strona lokalu ↗</a><a href="${esc(r.order)}" target="_blank" rel="noopener noreferrer">Zamów na wynos ↗</a></div></article>`).join('')}</div><div class="info-card" style="margin-top:28px"><span class="eyebrow">Kontakt ogólny</span><h3>Masz pytania?</h3><p>Restauracje: <a href="mailto:azzurro.restauracja@gmail.com" style="text-decoration:underline">azzurro.restauracja@gmail.com</a>. Warsztaty i sala: <a href="mailto:azzurro.imprezy@gmail.com" style="text-decoration:underline">azzurro.imprezy@gmail.com</a>. Catering: <a href="mailto:kontakt@azzurro.catering" style="text-decoration:underline">kontakt@azzurro.catering</a>.</p><p class="tiny muted">Dane pobrane z oficjalnych witryn. Przed publikacją należy potwierdzić je z właścicielem.</p></div></div></section>`;}
  function footer(){return `<div class="wrap"><div class="footer-grid"><div class="footer-brand"><a class="brand" href="#/" aria-label="Azzurro strona główna"><strong>azzurro</strong><small>RESTAURACJE · TORUŃ</small></a><p>Pizza, pasta i dobre chwile przy wspólnym stole.<br>Trzy restauracje w Toruniu.</p><p class="tiny">Uwaga: napis w nagłówku i stopce jest zastępczym typograficznym miejscem na oryginalne logo Azzurro.</p></div><div><div class="footer-heading">Odkrywaj</div><a href="#/menu">Menu</a><a href="#/galeria">Galeria</a><a href="#/warsztaty">Warsztaty</a><a href="#/sala-bankietowa">Sala bankietowa</a><a href="#/catering">Catering</a></div><div><div class="footer-heading">Restauracje</div>${places().map(r=>`<a href="#/lokale/${r.id}">${esc(r.name)}</a>`).join('')}<a href="#/kontakt">Kontakt</a></div><div><div class="footer-heading">Bądźmy w kontakcie</div><a href="mailto:azzurro.restauracja@gmail.com">Napisz do nas</a><a href="https://www.facebook.com/AzzurroNaSkarpie" target="_blank" rel="noopener noreferrer">Facebook ↗</a><a href="https://www.instagram.com/azzurro.restauracje/" target="_blank" rel="noopener noreferrer">Instagram ↗</a><a href="${OFFICIAL}" target="_blank" rel="noopener noreferrer">Oficjalna strona ↗</a></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} Azzurro Restauracje · Projekt demonstracyjny, nieoficjalny</span><span>Fotografie: Azzurro / zdjęcia dań DEMO: Unsplash · Teksty i ceny: oficjalna witryna, do weryfikacji</span></div></div>`;}
  function normalizeRoute(){const raw=(location.hash||'#/').slice(1);return raw.split('?')[0].replace(/\/$/,'')||'/';}
  function parseLocationFromHash(){let raw=(location.hash||'').split('?')[1]||'';return new URLSearchParams(raw).get('lokal');}
  let currentRoute='';
  function renderRoute(){
    const route=normalizeRoute(), locParam=parseLocationFromHash();
    if(locParam&&RESTAURANTS[locParam])selectedLocation=locParam;
    menuCategory='Wszystkie';menuQuery='';galleryType='Wszystkie';
    let markup='',pageTitle='Azzurro Restauracje';
    if(route==='/'){markup=home();pageTitle='Dobry smak. Dobry czas.';}
    else if(route==='/menu'){markup=menuPage();pageTitle='Menu';}
    else if(route.startsWith('/lokale/')){const id=route.slice('/lokale/'.length);if(RESTAURANTS[id]){markup=locationPage(RESTAURANTS[id]);pageTitle=RESTAURANTS[id].name;} }
    else if(route==='/warsztaty'){markup=workshops();pageTitle='Warsztaty kulinarne';}
    else if(route==='/sala-bankietowa'){markup=bankiet();pageTitle='Sala bankietowa';}
    else if(route==='/catering'){markup=catering();pageTitle='Catering';}
    else if(route==='/galeria'){markup=galleryPage();pageTitle='Galeria';}
    else if(route==='/kontakt'){markup=contactPage();pageTitle='Kontakt';}
    if(!markup){markup=pageHero('404 / Nie znaleziono','Tędy nie trafisz <em>do Azzurro.</em>','Ta podstrona nie istnieje.')+'<section class="section tight"><div class="wrap"><a class="btn" href="#/">Wróć na stronę główną ↗</a></div></section>';pageTitle='Nie znaleziono strony';}
    MAIN.innerHTML=markup;document.getElementById('footer').innerHTML=footer();
    document.title=pageTitle+' | Azzurro Restauracje';
    document.querySelector('meta[name="description"]').content=pageTitle+' - Restauracje Azzurro w Toruniu. Menu, lokalizacje, warsztaty, sala bankietowa i catering.';
    currentRoute=route;
    document.querySelectorAll('[data-nav]').forEach(a=>{const key=a.dataset.nav;const active=key==='lokale'?route.startsWith('/lokale'):route==='/'+key;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    document.documentElement.classList.remove('menu-open');const toggle=document.getElementById('nav-toggle');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Otwórz menu');
    renderMenuResults();galleryVisible=visibleGallery();setupReveals();window.scrollTo(0,0);
    // Dane strukturalne tworzone ze zweryfikowanej konfiguracji, bez duplikowania wpisów.
    let structured=document.getElementById('restaurant-ld-json');
    if(!structured){structured=document.createElement('script');structured.type='application/ld+json';structured.id='restaurant-ld-json';document.head.appendChild(structured);}
    structured.textContent=JSON.stringify({'@context':'https://schema.org','@graph':places().map(r=>({'@type':'Restaurant',name:r.name,telephone:'+48 '+r.phone,address:{'@type':'PostalAddress',streetAddress:r.address.split(',')[0],addressLocality:'Toruń',postalCode:'87-100',addressCountry:'PL'},hasMenu:r.officialMenu,url:OFFICIAL,openingHoursSpecification:[{ '@type':'OpeningHoursSpecification',dayOfWeek:['Monday','Tuesday','Wednesday','Thursday'],opens:'11:00',closes:'21:00' },{'@type':'OpeningHoursSpecification',dayOfWeek:'Friday',opens:'11:00',closes:'21:30'},{'@type':'OpeningHoursSpecification',dayOfWeek:'Saturday',opens:'12:00',closes:'21:30'},{'@type':'OpeningHoursSpecification',dayOfWeek:'Sunday',opens:'12:00',closes:'21:00'}]}))});
  }
  function setupReveals(){
    const elements=[...MAIN.querySelectorAll('[data-reveal]')];
    if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){elements.forEach(el=>el.classList.add('is-visible'));return;}
    const obs=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');obs.unobserve(entry.target);}});},{threshold:.08});elements.forEach(el=>obs.observe(el));
  }
  function visibleGallery(){
    if(currentRoute==='/galeria')return GALLERY.filter(x=>galleryType==='Wszystkie'||x.type===galleryType);
    if(currentRoute.startsWith('/lokale/')){const r=RESTAURANTS[currentRoute.slice('/lokale/'.length)];return r?[{src:r.photo,alt:r.photoAlt,caption:r.name+' · zdjęcie oficjalne',demo:false},{src:G.pizza2,alt:'Poglądowe zdjęcie pizzy',caption:'Potrawa · DEMO',demo:true},{src:G.pasta,alt:'Poglądowe zdjęcie makaronu',caption:'Potrawa · DEMO',demo:true}]:[];}
    if(currentRoute==='/sala-bankietowa')return [{src:G.bankiet,alt:'Sala bankietowa',caption:'Sala bankietowa · zdjęcie oficjalne',demo:false},{src:G.bankiet2,alt:'Stół bankietowy',caption:'Sala bankietowa · zdjęcie oficjalne',demo:false}];
    return GALLERY.slice(0,6);
  }
  const lightbox=document.getElementById('lightbox');
  function lightboxPaint(){const i=galleryVisible[galleryPosition];if(!i)return;document.getElementById('lightbox-image').src=i.src;document.getElementById('lightbox-image').alt=i.alt;document.getElementById('lightbox-caption').textContent=`${galleryPosition+1} / ${galleryVisible.length}  ·  ${i.caption||i.alt}${i.demo?' · DEMO':''}`;}
  function openLightbox(i){galleryVisible=visibleGallery();if(!galleryVisible[i])return;galleryPosition=i;focusBeforeLightbox=document.activeElement;lightboxPaint();lightbox.hidden=false;document.body.classList.add('lock-scroll');document.getElementById('lightbox-close').focus();}
  function closeLightbox(){if(lightbox.hidden)return;lightbox.hidden=true;document.body.classList.remove('lock-scroll');document.getElementById('lightbox-image').removeAttribute('src');if(focusBeforeLightbox&&document.contains(focusBeforeLightbox))focusBeforeLightbox.focus();}
  const lightboxMove=delta=>{if(galleryVisible.length){galleryPosition=(galleryPosition+delta+galleryVisible.length)%galleryVisible.length;lightboxPaint();}};
  document.addEventListener('click',event=>{
    const t=event.target;
    const navToggle=t.closest('#nav-toggle');if(navToggle){const open=document.documentElement.classList.toggle('menu-open');navToggle.setAttribute('aria-expanded',String(open));navToggle.setAttribute('aria-label',open?'Zamknij menu':'Otwórz menu');return;}
    const locBtn=t.closest('[data-select-location]');if(locBtn){selectedLocation=locBtn.dataset.selectLocation;menuCategory='Wszystkie';menuQuery='';const w=MAIN.querySelector('[data-menu-widget]');if(w){w.outerHTML=menuWidget(w.dataset.menuWidget==='preview');renderMenuResults();}return;}
    const catBtn=t.closest('[data-select-category]');if(catBtn){menuCategory=catBtn.dataset.selectCategory;renderMenuResults();return;}
    const resetBtn=t.closest('[data-reset-menu]');if(resetBtn){menuCategory='Wszystkie';menuQuery='';const w=MAIN.querySelector('[data-menu-widget]');if(w){w.querySelector('[data-menu-search]').value='';renderMenuResults();}return;}
    const galleryBtn=t.closest('[data-gallery-index]');if(galleryBtn){openLightbox(Number(galleryBtn.dataset.galleryIndex));return;}
    const galleryFilter=t.closest('[data-gallery-filter]');if(galleryFilter){galleryType=galleryFilter.dataset.galleryFilter;document.querySelectorAll('[data-gallery-filter]').forEach(b=>{const a=b.dataset.galleryFilter===galleryType;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a));});const output=document.getElementById('gallery-output');if(output)output.innerHTML=galleryTiles(visibleGallery());return;}
    if(t.closest('#lightbox-close')){closeLightbox();return;}
    if(t.closest('#lightbox-prev')){lightboxMove(-1);return;}
    if(t.closest('#lightbox-next')){lightboxMove(1);return;}
    if(t===lightbox){closeLightbox();return;}
    if(t.closest('#to-top')){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return;}
    const anchor=t.closest('a[href^="#/"]');if(anchor&&anchor.getAttribute('href')===location.hash){renderRoute();return;}
  });
  document.addEventListener('input',event=>{if(event.target.matches('[data-menu-search]')){menuQuery=event.target.value;renderMenuResults();}});
  document.addEventListener('keydown',event=>{
    if(!lightbox.hidden){if(event.key==='Escape'){event.preventDefault();closeLightbox();}else if(event.key==='ArrowLeft'){event.preventDefault();lightboxMove(-1);}else if(event.key==='ArrowRight'){event.preventDefault();lightboxMove(1);}else if(event.key==='Tab'){const enabled=[...lightbox.querySelectorAll('button:not([disabled])')];const first=enabled[0],last=enabled.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}}
    else if(event.key==='Escape'){document.documentElement.classList.remove('menu-open');document.getElementById('nav-toggle').setAttribute('aria-expanded','false');}
  });
  document.getElementById('to-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  window.addEventListener('scroll',()=>document.getElementById('to-top').classList.toggle('visible',window.scrollY>650),{passive:true});
  window.addEventListener('hashchange',()=>{closeLightbox();renderRoute();});
  document.documentElement.classList.add('js-ready');
  renderRoute();
  </script>
</body>
</html>
